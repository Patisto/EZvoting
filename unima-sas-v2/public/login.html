<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Staff login</title>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<header class="hero">
  <img src="/logo.png" alt="" class="site-logo"/>
  <div class="brand-tag">Staff</div>
  <h1>Sign in</h1>
  <p class="subtitle">Super admins and facilitators only.</p>
</header>
<div class="container">
  <div class="card login-box">
    <label class="field">Username<input type="text" id="username" autocomplete="username" autocapitalize="none"/></label>
    <label class="field">Password<input type="password" id="password" autocomplete="current-password"/></label>
    <p id="err" class="small" style="color:var(--danger);min-height:18px;margin-bottom:8px"></p>
    <button class="btn primary block" id="loginBtn" type="button">Sign in</button>
  </div>
  <p class="small muted" style="text-align:center"><a href="/">← Back to elections</a></p>
</div>
<script src="/js/common.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
